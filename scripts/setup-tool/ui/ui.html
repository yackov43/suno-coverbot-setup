<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הקמת Suno CoverBot</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="window" aria-labelledby="title">
  <header><img src="/logo.png" alt="Suno CoverBot" width="224"><span class="os">Windows</span></header>
  <section>
    <h1 id="title">Suno CoverBot</h1>
    <p id="subtitle" class="scope"></p>
    <ol id="steps" class="steplist"></ol>
    <div id="note" class="note" hidden></div>
    <p id="done" class="result" hidden></p>
    <div class="actions"><button id="retry" class="primary" type="button" hidden></button><button id="close" class="primary" type="button" hidden></button></div>
  </section>
</main><script src="/ui.js"></script></body></html>
